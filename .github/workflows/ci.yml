name: PR06 Checks

on: [push, pull_request]

permissions:
  contents: read

env:
  COURSE_KIT_ARCHIVE: robotics-course-kit-v1-w07-9b7fdd5424d3.tar.gz
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w07-9b7fdd5424d3.tar.gz
  COURSE_KIT_SHA256: 9b7fdd5424d3d97e47d51dbe23064934585e62135dc2902844dd679529bda929

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:12f03ad224f4f7801c4eeb320934b198fe0b9536d70f2f617894da08ca3bedba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and test ROS packages
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          test -f "$(ros2 pkg prefix course_bringup)/share/course_bringup/launch/bringup.launch.py"
          test -f "$(ros2 pkg prefix course_bringup)/share/course_bringup/config/qos-overrides.yaml"
          xacro "$(ros2 pkg prefix course_description)/share/course_description/urdf/vehicle.urdf.xacro" > /tmp/vehicle.urdf
          check_urdf /tmp/vehicle.urdf
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py src/patrol/patrol/patrol.py \
            src/course_bringup/launch/bringup.launch.py src/course_bringup/course_bringup/*.py \
            src/course_description/launch/display.launch.py src/course_description/course_description/*.py
          colcon test --packages-select patrol course_bringup course_description --event-handlers console_direct+
          colcon test-result --verbose
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/patrol/pytest.xml
            build/course_bringup/pytest.xml
            build/course_description/pytest.xml
      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo "$COURSE_KIT_ARCHIVE" "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" "$COURSE_KIT_ARCHIVE" | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf "$COURSE_KIT_ARCHIVE" -C .course-kit
      - name: Check PR evidence
        shell: bash
        run: |
          python3 .course-kit/v1/tools/check_practice.py PR06 --submission .
