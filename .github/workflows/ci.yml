name: PR03 Checks

on: [push, pull_request]

permissions:
  contents: read

env:
  COURSE_KIT_ARCHIVE: robotics-course-kit-v1-w05-bca214e3de6f.tar.gz
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w05-bca214e3de6f.tar.gz
  COURSE_KIT_SHA256: bca214e3de6f90f9513049dfa0f36fee65ad834da502dc3f3f8fb443517b5197

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:12f03ad224f4f7801c4eeb320934b198fe0b9536d70f2f617894da08ca3bedba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and test ROS packages
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py src/patrol/patrol/patrol.py
          colcon test --packages-select patrol --event-handlers console_direct+
          colcon test-result --verbose
      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo "$COURSE_KIT_ARCHIVE" "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" "$COURSE_KIT_ARCHIVE" | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf "$COURSE_KIT_ARCHIVE" -C .course-kit
      - name: Check PR evidence
        shell: bash
        run: |
          python3 .course-kit/v1/tools/check_practice.py PR03 --submission .
